version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jinro-postgres
    environment:
      POSTGRES_USER: jinro_user
      POSTGRES_PASSWORD: jinro_password
      POSTGRES_DB: jinro_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
